<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#293132">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Blink">
    <title>Blink</title>
    <link rel="preconnect" href="https://img.youtube.com">
    <link rel="preconnect" href="https://api.github.com">
    <link rel="modulepreload" href="js/main.js?v=29">
    <link rel="stylesheet" href="css/style.css?v=29">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
    <link rel="apple-touch-icon" href="images/icon-192.png">
    <script>
        if ('serviceWorker' in navigator) {
            const local = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
            if (local) {
                Promise.all([
                    navigator.serviceWorker.getRegistrations().then(registrations => Promise.all(registrations.map(registration => registration.unregister()))),
                    'caches' in window ? caches.keys().then(keys => Promise.all(keys.map(key => caches.delete(key)))) : Promise.resolve()
                ]).then(() => {
                    if (navigator.serviceWorker.controller && !sessionStorage.getItem('blink:local-sw-cleared')) {
                        sessionStorage.setItem('blink:local-sw-cleared', '1');
                        location.reload();
                    }
                });
            } else {
                navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });
            }
        }
    </script>
</head>
<body data-retention-days="<!-- items_retention_days_placeholder -->" data-disable-shorts="<!-- disable_shorts_placeholder -->">
    <div id="loading">
        <div class="skeleton">
            <div class="skeleton-card"><div class="skeleton-media"></div><div class="skeleton-title"></div><div class="skeleton-meta"></div></div>
            <div class="skeleton-card"><div class="skeleton-media"></div><div class="skeleton-title"></div><div class="skeleton-meta"></div></div>
            <div class="skeleton-card"><div class="skeleton-title" style="width:85%"></div><div class="skeleton-meta"></div></div>
        </div>
    </div>

    <div id="feed">
        <header class="update-header"><!-- last_updated_placeholder --></header>
    </div>
    <div id="empty">
        <div class="icon">&#x2713;</div>
        <p class="title">You're all caught up</p>
        <p class="sub">No new items right now</p>
    </div>

    <div id="setup-form" style="display:none;">
        <div class="setup-content">
            <img src="images/icon-192.png" alt="Blink" class="setup-icon">
            <h2>Blink</h2>
            <p class="setup-desc">Connect GitHub to sync starred items across devices.</p>
            <div id="setup-status" class="status"></div>
            <button id="setup-connect-github-btn" class="btn setup-btn">Connect GitHub</button>
        </div>
    </div>

    <div id="floating-buttons">
        <div class="floating-left floating-group">
            <a id="repo-link" class="btn floating-btn github-btn" href="https://github.com/tinykings/blink" target="_blank" rel="noopener noreferrer" title="Project on GitHub" aria-label="Project on GitHub">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.86c-2.78.6-3.37-1.18-3.37-1.18-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.89 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.64-1.34-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.99 1.03-2.69-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.03a9.58 9.58 0 0 1 5 0c1.91-1.3 2.75-1.03 2.75-1.03.55 1.38.2 2.4.1 2.65.64.7 1.03 1.6 1.03 2.69 0 3.84-2.34 4.69-4.57 4.94.36.31.68.92.68 1.85v2.75c0 .27.18.58.69.48A10 10 0 0 0 12 2Z"/></svg>
            </a>
        </div>
        <div id="feed-sync-status" class="feed-sync-status" role="status" aria-live="polite" aria-atomic="true" hidden>
            <span class="sync-spinner" aria-hidden="true"></span>
            <span id="feed-sync-text">Saving read state...</span>
        </div>
        <button id="mark-read-btn" class="btn floating-btn floating-right" title="Mark current items read" aria-label="Mark current items read" disabled>
            <svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>
        </button>
    </div>

    <div id="toast-container"></div>

    <div id="keyboard-help" role="dialog" aria-modal="true" aria-labelledby="keyboard-help-title">
        <div class="modal-content">
            <h2 id="keyboard-help-title">Keyboard Shortcuts</h2>
            <ul>
                <li><kbd>j</kbd> <span class="desc">Next item</span></li>
                <li><kbd>k</kbd> <span class="desc">Previous item</span></li>
                <li><kbd>s</kbd> <span class="desc">Save / unsave</span></li>
                <li><kbd>e</kbd> <span class="desc">Toggle description</span></li>
                <li><kbd>o</kbd> <span class="desc">Open item</span></li>
                <li><kbd>?</kbd> <span class="desc">Show help</span></li>
            </ul>
        </div>
    </div>

    <script type="module" src="js/main.js?v=29"></script>
</body>
</html>
